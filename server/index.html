<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus · Доска задач</title>
<style>
  :root{
    --bg-top:#0A0812; --bg-bottom:#141021; --column:#100D19; --card:#171326;
    --card-hover:#1D1830; --border:#272038; --text:#EDEAF6; --dim:#9C95B4; --faint:#6B6482;
    --accent:#8B5CF6; --accent-soft:#A78BFA; --green:#34D399; --amber:#FBBF24;
    --red:#F87171; --slate:#64748B;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--text);
    font:15px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 700px at 12% -10%, #1B1430 0%, transparent 60%),
               radial-gradient(900px 600px at 100% 0%, #171029 0%, transparent 55%),
               linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1440px;margin:0 auto;padding:26px 28px 40px}
  header{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:12px}
  .mark{
    width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(145deg,#8B5CF6,#5B34C4 70%);
    box-shadow:0 8px 24px -10px #8B5CF6, inset 0 1px 0 #ffffff33;
    font-weight:700;font-size:16px;letter-spacing:-.5px;
  }
  h1{font-size:21px;margin:0;font-weight:600;letter-spacing:-.2px}
  .sub{color:var(--faint);font-size:12.5px;margin-top:2px}
  .spacer{flex:1}
  .pill{
    display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:11px;
    font-size:12.5px;color:var(--dim);border:1px solid var(--border);background:#0F0C1A;
  }
  .pill b{color:var(--text);font-weight:600}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px #34d39922}
  .dot.stale{background:var(--amber);box-shadow:0 0 0 3px #fbbf2422}
  .stats{display:flex;gap:22px;color:var(--dim);font-size:13px;padding-bottom:2px}
  .stats span b{color:var(--text);font-weight:600;margin-right:4px}
  .views{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin:0 0 22px}
  .vcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px 16px;
    box-shadow:0 20px 50px -40px #000}
  .vhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .vhead b{font-size:13px;font-weight:600;color:var(--text);letter-spacing:-.1px}
  .vtag{margin-left:auto;font-size:10px;letter-spacing:.6px;color:var(--faint);text-transform:uppercase}
  .vbig{font-size:26px;font-weight:700;color:var(--accent-soft);letter-spacing:-.6px}
  .vsub{font-size:12px;color:var(--dim);margin-top:4px}
  .vrow{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;color:var(--text)}
  .vrow i{width:7px;height:7px;border-radius:50%;background:var(--slate);flex:none}
  .vrow i.ok{background:var(--green)} .vrow i.warn{background:var(--amber)} .vrow i.err{background:var(--red)}
  .vrow span{margin-left:auto;color:var(--dim);font-size:12px}
  .vbar{height:8px;border-radius:5px;background:var(--border);overflow:hidden;margin-top:10px}
  .vbar div{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent-soft))}
  .vtext{font-size:13px;color:var(--dim);white-space:pre-wrap;line-height:1.5}
  .vlog{font:11.5px/1.5 "Cascadia Mono",Consolas,monospace;color:var(--dim);background:#0B0913;
    border:1px solid var(--border);border-radius:10px;padding:10px;max-height:180px;overflow:auto;white-space:pre-wrap}
  .vlink{display:block;font-size:13px;color:var(--accent-soft);text-decoration:none;padding:4px 0}
  .vlink:hover{text-decoration:underline}
  .vcode-btn{border:1px solid var(--border);background:#0F0C1A;color:var(--text);border-radius:9px;
    padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
  .vcode-pre{font:11.5px/1.5 "Cascadia Mono",Consolas,monospace;color:var(--dim);background:#0B0913;
    border:1px solid var(--border);border-radius:10px;padding:10px;max-height:220px;overflow:auto;white-space:pre;margin:10px 0 0}
  .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start}
  @media (max-width:1080px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:640px){.board{grid-template-columns:1fr}.wrap{padding:18px}}
  .col{
    background:linear-gradient(180deg,#100D19F2,#0E0B17F2);border:1px solid var(--border);
    border-radius:16px;padding:12px 12px 14px;min-height:160px;
    box-shadow:0 24px 60px -40px #000;
  }
  .colhead{display:flex;align-items:center;gap:9px;padding:4px 6px 12px;font-size:12.5px;
    letter-spacing:.4px;text-transform:uppercase;color:var(--dim);font-weight:600}
  .cnt{margin-left:auto;font-size:11.5px;color:var(--faint);background:#0C0A15;
    border:1px solid var(--border);border-radius:8px;padding:1px 7px;letter-spacing:0}
  .barlight{height:2px;border-radius:2px;width:26px}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:11px 12px 10px;margin-bottom:9px;transition:background .15s,border-color .15s;
    position:relative;overflow:hidden;
  }
  .card:hover{background:var(--card-hover);border-color:#33294a}
  .card.off{opacity:.5}
  .ttl{font-size:14px;font-weight:550;letter-spacing:-.1px;word-break:break-word}
  .note{color:var(--dim);font-size:12.5px;margin-top:5px;word-break:break-word;white-space:pre-wrap}
  .meta{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:11px;color:var(--faint)}
  .id{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;color:#8f88a8}
  .tag{border:1px solid var(--border);border-radius:6px;padding:0 5px;font-size:10.5px;letter-spacing:.2px}
  .track{height:3px;border-radius:2px;background:#2A2340;margin-top:9px;overflow:hidden}
  .track i{display:block;height:100%;border-radius:2px;background:var(--accent-soft)}
  .empty{color:var(--faint);font-size:12.5px;padding:10px 8px;border:1px dashed #241d36;border-radius:10px;text-align:center}
  footer{margin-top:26px;display:flex;gap:16px;align-items:center;color:var(--faint);font-size:12px;flex-wrap:wrap}
  footer code{font-family:ui-monospace,Consolas,monospace;color:#8f88a8}
  details{margin-top:18px;border-top:1px solid #1d1830;padding-top:12px}
  summary{cursor:pointer;color:var(--dim);font-size:13px;user-select:none}
  .feed{margin-top:10px;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:#9c95b4;
    max-height:220px;overflow:auto;white-space:pre-wrap;line-height:1.6}
  .feed b{color:var(--accent-soft);font-weight:500}
  .err{border-color:#5b2734;background:#1d1119;color:#f0a3ad;padding:14px 16px;border-radius:12px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark">N</div>
      <div>
        <h1 data-i18n="title">Nexus · Доска задач</h1>
        <div class="sub"><span data-i18n="subtitle">сайт только для просмотра · данные: tasks.json</span></div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="stats" id="stats"></div>
    <div class="pill"><span class="dot" id="dot"></span><span data-i18n="modeWord">режим</span> <b id="mode">—</b></div>
    <button id="langBtn" style="border:1px solid var(--border);background:#0F0C1A;color:var(--dim);border-radius:10px;padding:6px 11px;font:inherit;font-size:12.5px;cursor:pointer">EN</button>
  </header>
  <div id="views" class="views"></div>
  <div id="board" class="board"></div>
  <details>
    <summary data-i18n="feedTitle">Лента событий (последние 40)</summary>
    <div class="feed" id="feed">—</div>
  </details>
  <footer>
    <span><span data-i18n="updated">обновлено</span> <b id="upd" style="color:#c9c3dd">—</b></span>
    <span data-i18n="pollEvery">опрос каждые 2 с</span>
    <span><span data-i18n="port">порт</span> <code>8788</code></span>
    <span><a href="/train" data-i18n="trainLink" style="color:#A78BFA;text-decoration:none">прогресс обучения →</a></span>
  </footer>
</div>
<script>
const DICT = {
  ru: {
    docTitle: "Nexus · Доска задач",
    title: "Nexus · Доска задач",
    subtitle: "сайт только для просмотра · данные: tasks.json",
    modeWord: "режим",
    feedTitle: "Лента событий (последние 40)",
    feedEmpty: "пока пусто",
    updated: "обновлено",
    pollEvery: "опрос каждые 2 с",
    port: "порт",
    trainLink: "прогресс обучения →",
    inPlan: "в плане",
    inWork: "в работе",
    closed: "закрыто",
    empty: "пусто",
    errTasks: "Не читается tasks.json:",
    colTodo: "План",
    colDoing: "В работе",
    colBlocked: "Заблокировано",
    colDone: "Готово",
    langBtn: "EN",
  },
  en: {
    docTitle: "Nexus · Task board",
    title: "Nexus · Task board",
    subtitle: "view-only site · data: tasks.json",
    modeWord: "mode",
    feedTitle: "Activity feed (last 40)",
    feedEmpty: "nothing yet",
    updated: "updated",
    pollEvery: "polled every 2 s",
    port: "port",
    trainLink: "training progress →",
    inPlan: "planned",
    inWork: "in progress",
    closed: "closed",
    empty: "empty",
    errTasks: "Cannot read tasks.json:",
    colTodo: "Planned",
    colDoing: "In progress",
    colBlocked: "Blocked",
    colDone: "Done",
    langBtn: "RU",
  },
};
const LANG_KEY = "nt-lang";
function boardLang() {
  const fromUrl = new URLSearchParams(location.search).get("lang");
  if (fromUrl === "ru" || fromUrl === "en") return fromUrl;
  const saved = localStorage.getItem(LANG_KEY);
  if (saved === "ru" || saved === "en") return saved;
  return String(navigator.language || "").toLowerCase().startsWith("ru") ? "ru" : "en";
}
function t(key) {
  const dict = DICT[boardLang()] || DICT.ru;
  return dict[key] != null ? dict[key] : key;
}
function applyStatic() {
  document.documentElement.lang = boardLang();
  document.title = t("docTitle");
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  const btn = document.getElementById("langBtn");
  if (btn) btn.textContent = t("langBtn");
}
const locale = () => (boardLang() === "ru" ? "ru-RU" : "en-GB");
const COLS = [
  {key:"todo",    label:"colTodo",    color:"#64748B"},
  {key:"doing",   label:"colDoing",   color:"#8B5CF6"},
  {key:"blocked", label:"colBlocked", color:"#F87171"},
  {key:"done",    label:"colDone",    color:"#34D399"}
];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = ts => { try { return new Date(ts).toLocaleString(locale(),{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); } catch { return ""; } };

function card(t){
  const off = t.Status === "done" || t.Status === "dropped" ? " off" : "";
  const p = Math.max(0, Math.min(100, Number(t.Progress)||0));
  const bar = t.Status === "blocked" ? "#F87171" : t.Status === "done" ? "#34D399" : "#A78BFA";
  const src = t.Source ? `<span class="tag">${esc(t.Source)}</span>` : "";
  const note = t.Note ? `<div class="note">${esc(t.Note)}</div>` : "";
  const prog = (p > 0 && t.Status !== "done") ? `<div class="track"><i style="width:${p}%;background:${bar}"></i></div>` : "";
  return `<div class="card${off}">
    <div class="ttl">${esc(t.Title)}</div>${note}
    <div class="meta"><span class="id">${esc(t.Id)}</span>${src}${t.Mode ? `<span class="tag">${esc(t.Mode)}</span>` : ""}<span style="margin-left:auto">${fmt(t.Updated || t.Created)}</span></div>
    ${prog}
  </div>`;
}

function render(d){
  const tasks = d.tasks || [];
  document.getElementById("mode").textContent = d.mode || "idle";
  const doing = tasks.filter(t => t.Status === "doing").length;
  const plan = tasks.filter(t => t.Status === "todo" || t.Status === "blocked").length;
  const done = tasks.filter(t => t.Status === "done" || t.Status === "dropped").length;
  document.getElementById("stats").innerHTML =
    `<span><b>${plan}</b>${t("inPlan")}</span><span><b>${doing}</b>${t("inWork")}</span><span><b>${done}</b>${t("closed")}</span>`;
  const board = document.getElementById("board");
  if (!d.ok){
    board.innerHTML = `<div class="err" style="grid-column:1/-1">${esc(t("errTasks"))} ${esc(d.error||"")}</div>`;
    return;
  }
  board.innerHTML = COLS.map(c => {
    const list = tasks.filter(t => c.key === "done"
      ? (t.Status === "done" || t.Status === "dropped")
      : t.Status === c.key);
    list.sort((a,b) => (Number(b.Priority)||0) - (Number(a.Priority)||0) || String(b.Updated||"").localeCompare(String(a.Updated||"")));
    return `<section class="col">
      <div class="colhead"><span class="barlight" style="background:${c.color}"></span>${t(c.label)}
        <span class="cnt">${list.length}</span></div>
      ${list.length ? list.map(card).join("") : `<div class="empty">${t("empty")}</div>`}
    </section>`;
  }).join("");
}


function vEsc(v){ return esc(v == null ? "" : String(v)); }

function vCard(b){
  const body = b.body || {};
  const title = vEsc(b.title || b.kind);
  const head = `<div class="vhead"><b>${title}</b><span class="vtag">${vEsc(b.kind)}</span></div>`;
  if (b.kind === "metric"){
    return `<div class="vcard">${head}<div class="vbig">${vEsc(body.value)} ${vEsc(body.unit)}</div>
      <div class="vsub">${vEsc(body.sub)}</div></div>`;
  }
  if (b.kind === "progress"){
    const pct = Math.max(0, Math.min(100, Number(body.value) || 0));
    return `<div class="vcard">${head}<div class="vsub">${vEsc(body.label)}</div>
      <div class="vbar"><div style="width:${pct}%"></div></div>
      <div class="vsub" style="display:flex"><span>${pct}%</span><span style="margin-left:auto">${vEsc(body.eta)}</span></div></div>`;
  }
  if (b.kind === "status"){
    const items = Array.isArray(body.items) ? body.items : [];
    return `<div class="vcard">${head}${items.map(it =>
      `<div class="vrow"><i class="${vEsc(it.state || "")}"></i>${vEsc(it.label)}<span>${vEsc(it.note)}</span></div>`).join("")}</div>`;
  }
  if (b.kind === "text"){
    return `<div class="vcard">${head}<div class="vtext">${vEsc(body.text)}</div></div>`;
  }
  if (b.kind === "log"){
    const lines = b.tail && Array.isArray(b.tail.lines) ? b.tail.lines.slice(-14) : [];
    const text = lines.length ? lines.join("\n") : (b.tail && b.tail.error ? vEsc(b.tail.error) : "—");
    return `<div class="vcard">${head}<div class="vlog">${vEsc(text)}</div></div>`;
  }
  if (b.kind === "links"){
    const items = Array.isArray(body.items) ? body.items : [];
    const href = u => /^https?:\/\//i.test(String(u || "")) ? vEsc(u) : "#";
    return `<div class="vcard">${head}${items.map(it =>
      `<a class="vlink" href="${href(it.url)}" target="_blank" rel="noopener">${vEsc(it.label)}${it.note ? " · " + vEsc(it.note) : ""}</a>`).join("")}</div>`;
  }
  if (b.kind === "code"){
    return `<div class="vcard">${head}<div class="vsub">${vEsc(body.filename)} · v${vEsc(body.version)}</div>
      <button class="vcode-btn" data-code="${vEsc(b.id)}">показать код</button>
      <pre class="vcode-pre" id="code-${vEsc(b.id)}" hidden></pre></div>`;
  }
  if (b.kind === "tasks" || b.kind === "activity"){
    return `<div class="vcard">${head}<div class="vsub">${b.kind === "tasks"
      ? t("inPlan") + " / " + t("inWork") + " / " + t("closed")
      : t("feedTitle")}</div></div>`;
  }
  return "";
}

function renderViews(list){
  const host = document.getElementById("views");
  const cards = (list || []).map(vCard).filter(Boolean);
  host.innerHTML = cards.join("");
  host.querySelectorAll("button[data-code]").forEach(btn => {
    btn.onclick = async () => {
      const id = btn.getAttribute("data-code");
      const pre = document.getElementById("code-" + id);
      if (!pre.hidden){ pre.hidden = true; btn.textContent = "показать код"; return; }
      btn.textContent = "…";
      try{
        const r = await fetch("/api/code?id=" + encodeURIComponent(id), {cache:"no-store"});
        const d = await r.json();
        pre.textContent = (d.code && d.code.content) || "—";
        pre.hidden = false;
        btn.textContent = "скрыть код";
      }catch(e){ btn.textContent = "ошибка"; }
    };
  });
}

async function viewsTick(){
  try{
    const r = await fetch("/api/views", {cache:"no-store"});
    const d = await r.json();
    renderViews(d.blocks || []);
  }catch(e){}
}

async function tick(){
  try{
    const r = await fetch("/api/tasks", {cache:"no-store"});
    const d = await r.json();
    render(d);
    document.getElementById("upd").textContent = new Date().toLocaleTimeString(locale());
    document.getElementById("dot").className = "dot";
  }catch(e){
    document.getElementById("dot").className = "dot stale";
  }
}

async function feed(){
  try{
    const r = await fetch("/api/activity", {cache:"no-store"});
    const rows = await r.json();
    document.getElementById("feed").innerHTML = rows.length
      ? rows.map(e => `<div><b>${fmt(e.ts || e.Ts || "")}</b> ${esc(e.text || e.Text || JSON.stringify(e))}</div>`).join("")
      : t("feedEmpty");
  }catch{}
}

// запросы не наслаиваются: один тик до завершения предыдущего
const inFlight = new Set();
async function runOnce(name, fn){
  if (inFlight.has(name)) return;
  inFlight.add(name);
  try { await fn(); } finally { inFlight.delete(name); }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function pump(name, fn, ms){
  for (;;){
    if (!document.hidden) await runOnce(name, fn);
    await sleep(ms);
  }
}

applyStatic();
document.getElementById("langBtn").onclick = () => {
  const next = boardLang() === "ru" ? "en" : "ru";
  localStorage.setItem(LANG_KEY, next);
  const url = new URL(location.href);
  url.searchParams.set("lang", next);
  history.replaceState(null, "", url);
  applyStatic();
  runOnce("tick", tick);
  runOnce("feed", feed);
  runOnce("views", viewsTick);
};
pump("tick", tick, 2000);
pump("feed", feed, 6000);
pump("views", viewsTick, 5000);
</script>
</body>
</html>
