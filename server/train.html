<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus · Обучение</title>
<style>
  :root{
    --bg-top:#0A0812; --bg-bottom:#141021; --column:#100D19; --card:#171326;
    --border:#272038; --text:#EDEAF6; --dim:#9C95B4; --faint:#6B6482;
    --accent:#8B5CF6; --accent-soft:#A78BFA; --green:#34D399; --amber:#FBBF24;
    --red:#F87171; --slate:#64748B;
  }
  *{box-sizing:border-box}
  body{
    margin:0;color:var(--text);
    font:15px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    background:radial-gradient(1100px 700px at 8% -10%, #1B1430 0%, transparent 60%),
               radial-gradient(800px 600px at 100% 0%, #171029 0%, transparent 55%),
               linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
    background-attachment:fixed;-webkit-font-smoothing:antialiased;min-height:100vh;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:26px 28px 44px}
  header{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
  .mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(145deg,#8B5CF6,#5B34C4 70%);
    box-shadow:0 8px 24px -10px #8B5CF6, inset 0 1px 0 #ffffff33;font-weight:700;font-size:15px}
  h1{font-size:20px;margin:0;font-weight:600;letter-spacing:-.2px}
  .sub{color:var(--faint);font-size:12.5px;margin-top:2px}
  .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:11px;
    font-size:12.5px;color:var(--dim);border:1px solid var(--border);background:#0F0C1A}
  .pill b{color:var(--text);font-weight:600}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px #34d39922}
  .dot.stop{background:var(--red);box-shadow:0 0 0 3px #f8717122}
  .grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  @media (max-width:520px){
    .wrap{padding:18px 16px 34px}
    .kv{grid-template-columns:1fr;gap:8px}
    .kv .v{font-size:16px;line-height:1.35;overflow-wrap:anywhere}
    .card{padding:15px 15px 17px}
    .ring{width:190px;height:190px}
    .ring .big{font-size:30px}
    h1{font-size:18px}
  }
  .card{background:linear-gradient(180deg,#100D19F2,#0E0B17F2);border:1px solid var(--border);
    border-radius:16px;padding:18px 18px 20px;box-shadow:0 24px 60px -40px #000}
  .ring{position:relative;width:220px;height:220px;margin:6px auto 4px}
  .ring svg{transform:rotate(-90deg)}
  .ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .ring .big{font-size:34px;font-weight:600;letter-spacing:-1px}
  .ring .small{font-size:12px;color:var(--dim);margin-top:2px}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:14px}
  .kv div{background:#0C0A15;border:1px solid var(--border);border-radius:10px;padding:8px 10px}
  .kv .k{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px}
  .kv .v{font-size:14.5px;margin-top:3px;font-weight:550}
  .mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:13px;color:#c9c3dd}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin:0 0 12px;font-weight:600}
  .chart{width:100%;height:180px;display:block}
  .steps{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .step{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--dim)}
  .step i{width:18px;height:18px;border-radius:50%;border:1px solid var(--border);flex:0 0 auto;
    display:grid;place-items:center;font-style:normal;font-size:10px;color:var(--faint);margin-top:1px}
  .step.on i{border-color:var(--accent);color:var(--accent-soft);background:#8B5CF620}
  .step.on{color:var(--text)}
  .step b{color:#8f88a8;font-weight:500}
  .feed{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:#9c95b4;
    white-space:pre-wrap;line-height:1.7;max-height:150px;overflow:auto}
  footer{margin-top:22px;color:var(--faint);font-size:12px;display:flex;gap:16px;flex-wrap:wrap}
  .err{border:1px solid #5b2734;background:#1d1119;color:#f0a3ad;padding:14px 16px;border-radius:12px;
    font-size:13px;margin-bottom:16px}
  .btn{border:1px solid var(--border);background:#0F0C1A;color:var(--dim);border-radius:10px;
    padding:6px 11px;font:inherit;font-size:12.5px;cursor:pointer}
  a{color:var(--accent-soft)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">N</div>
    <div>
      <h1 data-i18n="title">Обучение Ada</h1>
      <div class="sub" data-i18n="subtitle">прогресс прогона · читается сервером</div>
    </div>
    <div class="spacer"></div>
    <div class="pill"><span class="dot" id="dot"></span><span id="state">—</span></div>
    <button class="btn" id="langBtn">EN</button>
  </header>

  <div id="err" class="err" hidden></div>

  <div class="grid">
    <section class="card">
      <div class="ring">
        <svg width="220" height="220" viewBox="0 0 220 220">
          <circle cx="110" cy="110" r="94" fill="none" stroke="#241d36" stroke-width="12"/>
          <circle id="arc" cx="110" cy="110" r="94" fill="none" stroke="#A78BFA" stroke-width="12"
                  stroke-linecap="round" stroke-dasharray="590.6" stroke-dashoffset="590.6"
                  style="transition:stroke-dashoffset .6s ease"/>
        </svg>
        <div class="val">
          <div>
            <div class="big" id="pct">—</div>
            <div class="small" id="run">—</div>
          </div>
        </div>
      </div>
      <div class="kv">
        <div><div class="k" data-i18n="stepLabel">шаг</div><div class="v mono" id="step">—</div></div>
        <div><div class="k" data-i18n="etaLabel">осталось (при текущем темпе)</div><div class="v mono" id="eta">—</div></div>
        <div><div class="k" data-i18n="elapsedLabel">прошло</div><div class="v mono" id="elapsed">—</div></div>
        <div><div class="k" id="lossLabel" data-i18n="lossLabel">eval loss</div><div class="v mono" id="loss">—</div></div>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="chartTitle">Loss по эпохе</h2>
      <canvas class="chart" id="chart" width="760" height="180"></canvas>
      <h2 style="margin-top:18px" data-i18n="chainTitle">Цепочка</h2>
      <div class="steps" id="steps"></div>
      <h2 style="margin-top:18px" data-i18n="feedTitle">Журнал цепочки</h2>
      <div class="feed" id="feed">—</div>
    </section>
  </div>

  <footer>
    <span data-i18n="budgetNote">бюджет прогона — 8 ч, дальше чекпойнт и стоп по времени</span>
    <span><span data-i18n="updated">обновлено</span> <b id="upd" style="color:#c9c3dd">—</b></span>
    <span data-i18n="pollNote">опрос каждые 5 с</span>
    <span><a id="board" href="/" data-i18n="boardLink">← к доске задач</a></span>
  </footer>
</div>
<script>
const CIRC = 2 * Math.PI * 94;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// адрес доски подставляет сервер (cookie HttpOnly, ключ из JS не читается)
const BOARD_URL = "__NEXUS_BOARD_URL__";

const DICT = {
  ru: {
    docTitle: "Nexus · Обучение",
    title: "Обучение Ada",
    subtitle: "прогресс прогона · читается сервером",
    stepLabel: "шаг",
    etaLabel: "осталось (при текущем темпе)",
    elapsedLabel: "прошло",
    lossLabel: "eval loss",
    lossTrainLabel: "loss (train)",
    chartTitle: "Loss по эпохе",
    chainTitle: "Цепочка",
    feedTitle: "Журнал цепочки",
    budgetNote: "бюджет прогона — 8 ч, дальше чекпойнт и стоп по времени",
    updated: "обновлено",
    pollNote: "опрос каждые 5 с",
    boardLink: "← к доске задач",
    langBtn: "EN",
    noRun: "запуск не найден",
    noLogs: "данных обучения нет",
    noChain: "журнал цепочки пуст",
    stageToken: "токенизация данных",
    stageTrain: "обучение",
    stageStart: "запуск",
    stageBuild: "сборка данных",
    paused: "обучение на паузе · лог молчит",
    silent: "логи молчат",
    noServer: "нет связи с сервером",
    sec: "с",
    etaBudget: "по бюджету 08:00 (полный проход {h} ч)",
    pausedEta: "на паузе · остаток {t}",
    chartEmpty: "данных пока нет",
    chartOne: "одна точка: {v} — ждём следующий eval",
    errNoData: "Нет данных обучения: ",
  },
  en: {
    docTitle: "Nexus · Training",
    title: "Ada training",
    subtitle: "run progress · served by the server",
    stepLabel: "step",
    etaLabel: "left (at current rate)",
    elapsedLabel: "elapsed",
    lossLabel: "eval loss",
    lossTrainLabel: "loss (train)",
    chartTitle: "Loss per epoch",
    chainTitle: "Chain",
    feedTitle: "Chain log",
    budgetNote: "run budget — 8 h, then checkpoint and stop on time",
    updated: "updated",
    pollNote: "polled every 5 s",
    boardLink: "← back to the task board",
    langBtn: "RU",
    noRun: "run not found",
    noLogs: "no training data",
    noChain: "chain log is empty",
    stageToken: "tokenizing data",
    stageTrain: "training",
    stageStart: "starting",
    stageBuild: "building dataset",
    paused: "training paused · log silent for",
    silent: "log silent for",
    noServer: "no connection to the server",
    sec: "s",
    etaBudget: "budget 08:00 (full pass {h} h)",
    pausedEta: "paused · left {t}",
    chartEmpty: "no data yet",
    chartOne: "single point: {v} — waiting for next eval",
    errNoData: "No training data: ",
  },
};

const LANG_KEY = "nt-lang";
function lang(){
  const fromUrl = new URLSearchParams(location.search).get("lang");
  if (fromUrl === "ru" || fromUrl === "en") return fromUrl;
  const saved = localStorage.getItem(LANG_KEY);
  if (saved === "ru" || saved === "en") return saved;
  return String(navigator.language || "").toLowerCase().startsWith("ru") ? "ru" : "en";
}
function t(key, vars){
  const dict = DICT[lang()] || DICT.ru;
  let s = dict[key] != null ? dict[key] : key;
  if (vars) for (const k of Object.keys(vars)) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}
function boardHref(){
  const injected = String(BOARD_URL || "");
  if (injected && injected.indexOf("__NEXUS_BOARD_URL__") === -1) return injected;
  // страница открыта статикой: остаётся ключ из адреса или вход через ворота
  const own = new URLSearchParams(location.search).get("k") || "";
  return own ? "/?k=" + encodeURIComponent(own) : "/";
}
function applyStatic(){
  document.documentElement.lang = lang();
  document.title = t("docTitle");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  $("langBtn").textContent = t("langBtn");
  $("board").href = boardHref();
}

function drawChart(values){
  const c = $("chart"), ctx = c.getContext("2d");
  const w = c.width, h = c.height, pad = 14;
  ctx.clearRect(0,0,w,h);
  if (!values || values.length < 2){
    ctx.fillStyle = "#6B6482"; ctx.font = "13px Segoe UI, sans-serif";
    ctx.fillText(values && values.length ? t("chartOne", {v: values[0].toFixed(4)}) : t("chartEmpty"), pad, h/2);
    return;
  }
  const min = Math.min(...values), max = Math.max(...values);
  const span = (max - min) || 0.01;
  const x = i => pad + (i * (w - pad*2)) / (values.length - 1);
  const y = v => h - pad - ((v - min) / span) * (h - pad*2);
  ctx.strokeStyle = "#241d36"; ctx.lineWidth = 1;
  for (let i=0;i<=3;i++){ const yy = pad + i*(h-pad*2)/3; ctx.beginPath(); ctx.moveTo(pad,yy); ctx.lineTo(w-pad,yy); ctx.stroke(); }
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,"#8B5CF655"); grad.addColorStop(1,"#8B5CF600");
  ctx.beginPath(); ctx.moveTo(x(0), y(values[0]));
  values.forEach((v,i)=>ctx.lineTo(x(i), y(v)));
  ctx.lineTo(x(values.length-1), h-pad); ctx.lineTo(x(0), h-pad); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  ctx.beginPath(); ctx.moveTo(x(0), y(values[0]));
  values.forEach((v,i)=>ctx.lineTo(x(i), y(v)));
  ctx.strokeStyle = "#A78BFA"; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = "#8B5CF6";
  values.forEach((v,i)=>{ ctx.beginPath(); ctx.arc(x(i), y(v), 3, 0, Math.PI*2); ctx.fill(); });
  ctx.fillStyle = "#9C95B4"; ctx.font = "11px Segoe UI, sans-serif";
  ctx.fillText(max.toFixed(4), pad, pad - 2);
  ctx.fillText(min.toFixed(4), pad, h - 2);
}

// «Цепочка» рисуется из chainLines: последняя строка — текущий этап
function renderChain(lines){
  const box = $("steps");
  const list = Array.isArray(lines) ? lines.filter(Boolean) : [];
  if (!list.length){
    box.innerHTML = `<div class="step"><i>·</i><span>${esc(t("noChain"))}</span></div>`;
    return;
  }
  box.innerHTML = list.map((raw, i) => {
    const line = String(raw);
    const m = line.match(/^\[([^\]]+)\]\s*(.*)$/);
    const when = m ? m[1] : "";
    const text = m ? m[2] : line;
    const on = i === list.length - 1 ? " on" : "";
    return `<div class="step${on}"><i>${i + 1}</i><span>${when ? `<b>${esc(when)}</b> ` : ""}${esc(text)}</span></div>`;
  }).join("");
}

let lastData = null;

function render(d){
  lastData = d;
  if (!d || d.ok === false){
    const box = $("err");
    box.textContent = t("errNoData") + ((d && d.error) || "—");
    box.hidden = false;
    $("pct").textContent = "—";
    $("run").textContent = t("noRun");
    $("step").textContent = "—";
    $("eta").textContent = "—";
    $("elapsed").textContent = "—";
    $("loss").textContent = "—";
    $("state").textContent = t("noLogs");
    $("dot").className = "dot stop";
    $("feed").textContent = t("noChain");
    renderChain([]);
    drawChart([]);
    return;
  }
  $("err").hidden = true;

  const pct = d.pct == null ? 0 : d.pct;
  $("pct").textContent = d.pct == null ? "—" : d.pct.toFixed(1) + "%";
  $("arc").setAttribute("stroke-dashoffset", String(CIRC * (1 - Math.max(0, Math.min(1, pct/100)))));
  $("arc").setAttribute("stroke", d.alive ? "#A78BFA" : "#F87171");
  $("run").textContent = d.run ? d.run : t("noRun");
  $("step").textContent = d.step != null ? d.step + " / " + d.total + (d.unit ? " " + d.unit : "") : "—";

  const budget = 8 * 3600;
  const paused = !d.alive && d.step != null;
  let etaText = d.remain || "—";
  if (d.remainSeconds && d.remainSeconds > budget) {
    etaText = t("etaBudget", { h: Math.round(d.remainSeconds / 3600) });
  }
  if (paused) etaText = t("pausedEta", { t: etaText });
  $("eta").textContent = etaText;
  $("elapsed").textContent = d.elapsed || "—";
  $("lossLabel").textContent = d.lossKind === "train" ? t("lossTrainLabel") : t("lossLabel");
  $("loss").textContent = d.loss == null ? "—" : Number(d.loss).toFixed(4);

  $("dot").className = "dot" + (d.alive ? "" : " stop");
  const stageLabel = d.stage === "tokenization" ? t("stageToken")
    : d.stage === "training" ? t("stageTrain")
    : d.stage === "start" ? t("stageStart") : t("stageBuild");
  const age = d.logAge == null ? "?" : d.logAge;
  $("state").textContent = d.alive ? stageLabel
    : (d.step != null ? t("paused") + " " + age + " " + t("sec")
                      : t("silent") + " " + age + " " + t("sec"));

  renderChain(d.chainLines || []);
  $("feed").textContent = (d.chainLines || []).join("\n") || t("noChain");
  drawChart(d.losses || []);
}

async function tick(){
  try{
    const r = await fetch("/api/train", {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    render(d);
    $("upd").textContent = new Date().toLocaleTimeString(lang() === "ru" ? "ru-RU" : "en-GB");
  }catch(e){
    $("dot").className = "dot stop";
    $("state").textContent = t("noServer");
  }
}

// один запрос за раз: следующая попытка только после завершения прошлой
const sleep = ms => new Promise(r => setTimeout(r, ms));
(async function pump(){
  for (;;){
    if (!document.hidden) await tick();
    await sleep(5000);
  }
})();

applyStatic();
$("langBtn").onclick = () => {
  const next = lang() === "ru" ? "en" : "ru";
  localStorage.setItem(LANG_KEY, next);
  const url = new URL(location.href);
  url.searchParams.set("lang", next);
  history.replaceState(null, "", url);
  applyStatic();
  if (lastData) render(lastData);
};
</script>
</body>
</html>
